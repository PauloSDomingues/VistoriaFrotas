<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria de Frota Universal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-12">

    <!-- Cabeçalho (Verde Esmeralda) -->
    <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-truck-fast text-2xl"></i>
                <h1 class="text-lg font-bold tracking-wide">Vistoria de Frota</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="alternarTela('historico')" id="btnHistorico" class="bg-emerald-700 hover:bg-emerald-800 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-clock-rotate-left"></i> Histórico
                </button>
                <button onclick="alternarTela('formulario')" id="btnForm" class="hidden bg-emerald-700 hover:bg-emerald-800 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Nova Vistoria
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-4">

        <section id="secaoFormulario" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-semibold text-emerald-600 uppercase tracking-wider mb-3">
                    <i class="fa-solid fa-info-circle mr-1"></i> Dados do Veículo e Vistoria
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Modelo do Veículo</label>
                        <input type="text" id="modeloVeiculo" placeholder="Ex: Fiat Uno, Moto Honda..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Placa do Veículo</label>
                        <input type="text" id="placaVeiculo" placeholder="Ex: ABC-1234" oninput="this.value = this.value.toUpperCase()" class="w-full border border-slate-300 rounded-lg p-2 text-sm uppercase focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Nome do Motorista / Responsável</label>
                        <input type="text" id="motorista" placeholder="Seu nome completo" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Quilometragem Atual (KM)</label>
                        <input type="number" id="quilometragem" placeholder="Ex: 45200" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-medium text-slate-600 mb-1">Data da Inspeção</label>
                        <input type="date" id="dataVistoria" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>
            </div>

            <div id="containerChecklist" class="space-y-4"></div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-semibold text-emerald-600 uppercase tracking-wider mb-3">
                    <i class="fa-solid fa-camera mr-1"></i> Registro Fotográfico de Avarias
                </h2>
                <div class="flex flex-col sm:flex-row gap-3 items-center">
                    <div class="w-full flex gap-2">
                        <label class="flex-1 bg-slate-50 border-2 border-dashed border-slate-300 hover:border-emerald-500 rounded-lg p-3 text-center cursor-pointer transition">
                            <i class="fa-solid fa-camera text-emerald-600 text-lg mb-1 block"></i>
                            <span class="text-xs font-medium text-slate-600">Tirar Foto</span>
                            <input type="file" accept="image/*" capture="environment" id="fotoCamera" class="hidden" onchange="processarFoto(event)">
                        </label>
                        <label class="flex-1 bg-slate-50 border-2 border-dashed border-slate-300 hover:border-emerald-500 rounded-lg p-3 text-center cursor-pointer transition">
                            <i class="fa-solid fa-image text-emerald-600 text-lg mb-1 block"></i>
                            <span class="text-xs font-medium text-slate-600">Galeria</span>
                            <input type="file" accept="image/*" id="fotoGaleria" class="hidden" onchange="processarFoto(event)">
                        </label>
                    </div>
                </div>
                <div id="galeriaFotos" class="grid grid-cols-3 sm:grid-cols-4 gap-2 mt-3"></div>
            </div>

            <button onclick="salvarVistoria()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition flex items-center justify-center gap-2 text-base">
                <i class="fa-solid fa-floppy-disk"></i> Salvar e Finalizar Vistoria
            </button>
        </section>

        <section id="secaoHistorico" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider">
                        <i class="fa-solid fa-list mr-1"></i> Vistorias Realizadas
                    </h2>
                    <span id="contadorHistorico" class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-full font-medium">0 registros</span>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-slate-400 text-sm"></i>
                    <input type="text" id="filtroHistorico" placeholder="Buscar por modelo, placa ou motorista..." onkeyup="filtrarHistorico()" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <div id="listaHistorico" class="space-y-3"></div>
        </section>

    </main>

    <div id="modalDetalhes" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-emerald-600 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-sm flex items-center gap-2">
                    <i class="fa-solid fa-file-lines"></i> Relatório de Vistoria
                </h3>
                <button onclick="fecharModal()" class="text-white hover:text-slate-200 text-lg font-bold">&times;</button>
            </div>
            
            <div id="conteudoModalDetalhes" class="p-4 overflow-y-auto space-y-4 text-sm flex-1"></div>

            <div class="bg-slate-50 border-t border-slate-200 p-3 flex flex-wrap gap-2 justify-end">
                <button onclick="compartilharPDFWhatsApp()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                    <i class="fa-brands fa-whatsapp text-sm"></i> Enviar PDF no WhatsApp
                </button>
                <button onclick="exportarPDFModal()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-file-pdf text-sm"></i> Baixar PDF
                </button>
                <button onclick="fecharModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg text-xs font-medium transition">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
        const categoriasChecklist = [
            {
                id: 'mecanica',
                titulo: 'Mecânica e Motor',
                icone: 'fa-gears',
                itens: ['Nível de Óleo do Motor', 'Água do Radiador / Arrefecimento', 'Fluido de Freio', 'Correias e Mangueiras']
            },
            {
                id: 'seguranca',
                titulo: 'Pneus e Segurança',
                icone: 'fa-car-burst',
                itens: ['Calibragem e Estado dos Pneus', 'Sistema de Freios (Pedal/Estacionamento)', 'Buzina e Sistema Elétrico', 'Faróis, Lanternas e Piscas']
            },
            {
                id: 'vidros',
                titulo: 'Vidros e Espelhos',
                icone: 'fa-car',
                itens: ['Para-brisa (Sem trincas ou avarias)', 'Vidros Laterais e Traseiro', 'Retrovisores (Integridade e regulagem)']
            },
            {
                id: 'emergencia',
                titulo: 'Itens de Emergência',
                icone: 'fa-triangle-exclamation',
                itens: ['Estepe calibrado e em boas condições', 'Macaco e Chave de Roda', 'Triângulo de Sinalização']
            },
            {
                id: 'telecom',
                titulo: 'Equipamentos de Telecom (ISP)',
                icone: 'fa-network-wired',
                itens: ['Máquina de Fusão de Fibra', 'OTDR / Power Meter', 'Escada (Fixação e estado geral)', 'Kit EPIs (Capacete, óculos, bota, cinto)']
            }
        ];

        let fotosSalvas = [];
        let vistoriasSalvas = JSON.parse(localStorage.getItem('vistorias_frota_universal')) || [];
        let vistoriaAtualDetalhe = null;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('dataVistoria').valueAsDate = new Date();
            renderizarChecklist();
            carregarHistorico();
            registrarServiceWorker();
        });

        function renderizarChecklist() {
            const container = document.getElementById('containerChecklist');
            container.innerHTML = '';

            categoriasChecklist.forEach(cat => {
                let htmlItens = cat.itens.map((item, idx) => `
                    <div class="flex items-center justify-between py-2 border-b border-slate-100 last:border-b-0">
                        <span class="text-xs sm:text-sm text-slate-700">${item}</span>
                        <div class="flex gap-2">
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="radio" name="${cat.id}_${idx}" value="Ok" checked class="text-emerald-600 focus:ring-emerald-500">
                                <span class="ml-1 text-xs text-emerald-700 font-medium">Ok</span>
                            </label>
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="radio" name="${cat.id}_${idx}" value="Ruim/Avaria" class="text-red-600 focus:ring-red-500">
                                <span class="ml-1 text-xs text-red-700 font-medium">Avaria</span>
                            </label>
                        </div>
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <h2 class="text-sm font-semibold text-emerald-600 uppercase tracking-wider mb-2 flex items-center gap-2">
                            <i class="fa-solid ${cat.icone}"></i> ${cat.titulo}
                        </h2>
                        <div class="space-y-1 mt-2">${htmlItens}</div>
                        <div class="mt-3 pt-2 border-t border-slate-100">
                            <label class="block text-xs font-medium text-slate-500 mb-1">Observações / Detalhes:</label>
                            <input type="text" id="obs_${cat.id}" placeholder="Ex: Avaria leve no parachoque..." class="w-full border border-slate-200 bg-slate-50 rounded-lg p-2 text-xs outline-none focus:bg-white focus:ring-1 focus:ring-emerald-500">
                        </div>
                    </div>
                `;
            });
        }

        function processarFoto(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    fotosSalvas.push(canvas.toDataURL('image/jpeg', 0.7));
                    atualizarGaleriaFotos();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function atualizarGaleriaFotos() {
            const galeria = document.getElementById('galeriaFotos');
            galeria.innerHTML = fotosSalvas.map((foto, index) => `
                <div class="relative group aspect-square bg-slate-200 rounded-lg overflow-hidden border border-slate-300">
                    <img src="${foto}" class="w-full h-full object-cover">
                    <button onclick="removerFoto(${index})" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow hover:bg-red-700">&times;</button>
                </div>
            `).join('');
        }

        function removerFoto(index) {
            fotosSalvas.splice(index, 1);
            atualizarGaleriaFotos();
        }

        function salvarVistoria() {
            const modelo = document.getElementById('modeloVeiculo').value.trim();
            const placa = document.getElementById('placaVeiculo').value.trim();
            const motorista = document.getElementById('motorista').value.trim();
            const quilometragem = document.getElementById('quilometragem').value.trim();
            const dataVistoria = document.getElementById('dataVistoria').value;

            if (!modelo || !placa || !motorista || !quilometragem) {
                alert('Por favor, preencha o Modelo, a Placa, o Motorista e a Quilometragem!');
                return;
            }

            let dadosChecklist = [];
            categoriasChecklist.forEach(cat => {
                let itensCat = [];
                cat.itens.forEach((item, idx) => {
                    const radios = document.getElementsByName(`${cat.id}_${idx}`);
                    let status = 'Ok';
                    for (let r of radios) { if (r.checked) status = r.value; }
                    itensCat.push({ nome: item, status: status });
                });
                let observacao = document.getElementById(`obs_${cat.id}`).value;
                dadosChecklist.push({ categoria: cat.titulo, itens: itensCat, obs: observacao });
            });

            const novaVistoria = {
                id: Date.now(),
                modelo, placa, motorista, quilometragem,
                data: dataVistoria,
                checklist: dadosChecklist,
                fotos: [...fotosSalvas]
            };

            vistoriasSalvas.unshift(novaVistoria);
            localStorage.setItem('vistorias_frota_universal', JSON.stringify(vistoriasSalvas));

            alert('Vistoria salva com sucesso!');
            limparFormulario();
            alternarTela('historico');
        }

        function limparFormulario() {
            document.getElementById('modeloVeiculo').value = '';
            document.getElementById('placaVeiculo').value = '';
            document.getElementById('motorista').value = '';
            document.getElementById('quilometragem').value = '';
            fotosSalvas = [];
            atualizarGaleriaFotos();
            renderizarChecklist();
        }

        function carregarHistorico() {
            const lista = document.getElementById('listaHistorico');
            const contador = document.getElementById('contadorHistorico');
            contador.innerText = `${vistoriasSalvas.length} registros`;

            if (vistoriasSalvas.length === 0) {
                lista.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-slate-400 text-xs">Nenhuma vistoria registrada ainda.</div>`;
                return;
            }

            lista.innerHTML = vistoriasSalvas.map(v => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-sm text-slate-800">${v.modelo} <span class="text-xs font-normal text-slate-500">(${v.placa})</span></h4>
                        <p class="text-xs text-slate-500 mt-0.5">Motorista: <span class="font-medium text-slate-700">${v.motorista}</span></p>
                        <p class="text-xs text-slate-500">Data: ${v.data} | KM: ${v.quilometragem}</p>
                    </div>
                    <button onclick="abrirDetalhes(${v.id})" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1">
                        <i class="fa-solid fa-eye"></i> Ver
                    </button>
                </div>
            `).join('');
        }

        function filtrarHistorico() {
            const termo = document.getElementById('filtroHistorico').value.toLowerCase();
            const filtradas = vistoriasSalvas.filter(v => 
                v.modelo.toLowerCase().includes(termo) || v.placa.toLowerCase().includes(termo) || v.motorista.toLowerCase().includes(termo)
            );
            
            const lista = document.getElementById('listaHistorico');
            if (filtradas.length === 0) {
                lista.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-slate-400 text-xs">Nenhum resultado encontrado.</div>`;
                return;
            }

            lista.innerHTML = filtradas.map(v => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-sm text-slate-800">${v.modelo} <span class="text-xs font-normal text-slate-500">(${v.placa})</span></h4>
                        <p class="text-xs text-slate-500 mt-0.5">Motorista: <span class="font-medium text-slate-700">${v.motorista}</span></p>
                        <p class="text-xs text-slate-500">Data: ${v.data} | KM: ${v.quilometragem}</p>
                    </div>
                    <button onclick="abrirDetalhes(${v.id})" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1">
                        <i class="fa-solid fa-eye"></i> Ver
                    </button>
                </div>
            `).join('');
        }

        function abrirDetalhes(id) {
            const v = vistoriasSalvas.find(item => item.id === id);
            if (!v) return;
            vistoriaAtualDetalhe = v;

            let htmlChecklist = v.checklist.map(cat => `
                <div class="border-b border-slate-100 pb-2 mb-2">
                    <strong class="text-emerald-700 text-xs block uppercase">${cat.categoria}</strong>
                    ${cat.itens.map(i => `
                        <div class="flex justify-between text-xs py-0.5">
                            <span class="text-slate-700">${i.nome}</span>
                            <span class="font-semibold ${i.status === 'Ok' ? 'text-emerald-600' : 'text-red-600'}">${i.status}</span>
                        </div>
                    `).join('')}
                    ${cat.obs ? `<p class="text-xs text-slate-500 mt-1 italic bg-slate-50 p-1.5 rounded">Obs: ${cat.obs}</p>` : ''}
                </div>
            `).join('');

            let htmlFotos = v.fotos.length > 0 ? `
                <div class="mt-3">
                    <strong class="text-xs font-semibold text-slate-700 block mb-2">Fotos Registradas (${v.fotos.length})</strong>
                    <div class="grid grid-cols-4 gap-2">
                        ${v.fotos.map(f => `<img src="${f}" class="w-full h-20 object-cover rounded border border-slate-200">`).join('')}
                    </div>
                </div>
            ` : '';

            document.getElementById('conteudoModalDetalhes').innerHTML = `
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <p><strong>Veículo:</strong> ${v.modelo} (${v.placa})</p>
                    <p><strong>Motorista:</strong> ${v.motorista}</p>
                    <p><strong>KM:</strong> ${v.quilometragem} | <strong>Data:</strong> ${v.data}</p>
                </div>
                <div class="space-y-2 mt-3">
                    <h4 class="font-bold text-xs uppercase text-slate-600">Itens Verificados:</h4>
                    ${htmlChecklist}
                </div>
                ${htmlFotos}
            `;

            document.getElementById('modalDetalhes').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modalDetalhes').classList.add('hidden');
            vistoriaAtualDetalhe = null;
        }

        function gerarInstanciaPDF() {
            const v = vistoriaAtualDetalhe;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            let y = 15;
            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.setTextColor(5, 150, 105); // Cor verde no PDF
            doc.text("Relatorio de Vistoria de Veiculo", 14, y);
            
            y += 10;
            doc.setFontSize(10);
            doc.setTextColor(100, 100, 100);
            doc.text(`Data: ${v.data} | Quilometragem: ${v.quilometragem} KM`, 14, y);
            
            y += 6;
            doc.text(`Veiculo: ${v.modelo} - Placa: ${v.placa}`, 14, y);
            y += 6;
            doc.text(`Motorista / Responsavel: ${v.motorista}`, 14, y);

            y += 10;
            doc.setDrawColor(200, 200, 200);
            doc.line(14, y, 196, y);
            y += 8;

            v.checklist.forEach(cat => {
                if (y > 270) { doc.addPage(); y = 20; }
                doc.setFont("helvetica", "bold");
                doc.setFontSize(11);
                doc.setTextColor(5, 150, 105);
                doc.text(cat.categoria.toUpperCase(), 14, y);
                y += 6;

                doc.setFont("helvetica", "normal");
                doc.setFontSize(9);
                doc.setTextColor(50, 50, 50);

                cat.itens.forEach(item => {
                    if (y > 280) { doc.addPage(); y = 20; }
                    doc.text(`- ${item.nome}:`, 18, y);
                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(item.status === 'Ok' ? 5 : 220, item.status === 'Ok' ? 150 : 38, item.status === 'Ok' ? 105 : 38);
                    doc.text(item.status, 140, y);
                    doc.setFont("helvetica", "normal");
                    doc.setTextColor(50, 50, 50);
                    y += 5;
                });

                if (cat.obs) {
                    if (y > 275) { doc.addPage(); y = 20; }
                    doc.setFont("italic");
                    doc.setTextColor(100, 100, 100);
                    doc.text(`Obs: ${cat.obs}`, 18, y);
                    doc.setFont("normal");
                    y += 6;
                }
                y += 4;
            });

            if (v.fotos && v.fotos.length > 0) {
                doc.addPage();
                y = 20;
                doc.setFont("helvetica", "bold");
                doc.setFontSize(14);
                doc.setTextColor(5, 150, 105);
                doc.text("Registro Fotografico de Avarias", 14, y);
                y += 10;

                let xPos = 14;
                let imgWidth = 55;
                let imgHeight = 55;

                v.fotos.forEach((fotoBase64, index) => {
                    if (y > 220) { doc.addPage(); y = 20; xPos = 14; }
                    try {
                        doc.addImage(fotoBase64, 'JPEG', xPos, y, imgWidth, imgHeight);
                    } catch(e) {}

                    xPos += 62;
                    if ((index + 1) % 3 === 0) {
                        xPos = 14;
                        y += 62;
                    }
                });
            }
            return doc;
        }

        function exportarPDFModal() {
            if (!vistoriaAtualDetalhe) return;
            const doc = gerarInstanciaPDF();
            doc.save(`Vistoria_${vistoriaAtualDetalhe.placa}_${vistoriaAtualDetalhe.data}.pdf`);
        }

        async function compartilharPDFWhatsApp() {
            if (!vistoriaAtualDetalhe) return;
            const v = vistoriaAtualDetalhe;
            const doc = gerarInstanciaPDF();
            const pdfBlob = doc.output('blob');
            const nomeArquivo = `Vistoria_${v.placa}_${v.data}.pdf`;
            const arquivo = new File([pdfBlob], nomeArquivo, { type: 'application/pdf' });

            if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
                try {
                    await navigator.share({
                        title: 'Relatório de Vistoria',
                        text: `Relatório de vistoria do veículo ${v.modelo} (${v.placa}) - Motorista: ${v.motorista}`,
                        files: [arquivo],
                    });
                } catch (error) {
                    console.log('Compartilhamento cancelado ou falhou', error);
                }
            } else {
                doc.save(nomeArquivo);
                alert('Seu navegador não suporta envio direto de arquivos. O PDF foi baixado no aparelho. Agora você pode anexá-lo manualmente no WhatsApp!');
            }
        }

        function alternarTela(tela) {
            const form = document.getElementById('secaoFormulario');
            const hist = document.getElementById('secaoHistorico');
            const btnH = document.getElementById('btnHistorico');
            const btnF = document.getElementById('btnForm');

            if (tela === 'historico') {
                form.classList.add('hidden');
                hist.classList.remove('hidden');
                btnH.classList.add('hidden');
                btnF.classList.remove('hidden');
                carregarHistorico();
            } else {
                form.classList.remove('hidden');
                hist.classList.add('hidden');
                btnH.classList.remove('hidden');
                btnF.classList.add('hidden');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function registrarServiceWorker() {
            if ('serviceWorker' in navigator) {
                const swCode = `self.addEventListener('fetch', function(event) { event.respondWith(fetch(event.request).catch(() => caches.match(event.request))); });`;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            }
        }
    </script>
</body>
