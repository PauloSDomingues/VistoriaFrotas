<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria de Frota - Provedor</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Tailwind CSS para Estilização Rápida e Responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Biblioteca jsPDF para exportar PDF completo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-12">

    <!-- Cabeçalho -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-truck-fast text-2xl"></i>
                <h1 class="text-lg font-bold tracking-wide">Vistoria de Frota - ISP</h1>
            </div>
            <button onclick="alternarTela('historico')" id="btnHistorico" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
                <i class="fa-solid fa-clock-rotate-left"></i> Histórico
            </button>
            <button onclick="alternarTela('formulario')" id="btnForm" class="hidden bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> Nova Vistoria
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-4">

        <!-- TELA DO FORMULÁRIO DE VISTORIA -->
        <section id="secaoFormulario" class="space-y-4">
            
            <!-- Dados Gerais -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-semibold text-blue-600 uppercase tracking-wider mb-3">
                    <i class="fa-solid fa-info-circle mr-1"></i> Dados da Vistoria
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Veículo / Placa</label>
                        <select id="veiculo" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="">Selecione o veículo...</option>
                            <option value="Fiat Uno AYD7F01 ">Fiat Uno AYD7F01</option>
                            <option value="Fiat Uno AZW-5J93 ">Fiat Uno AZW-5J93</option>
                            <option value="Fiat Fiorino QOP3B89 ">Fiat Fiorino QOP3B89</option>
                            <option value="Fiat Fiorino SJD9D95 ">Fiat Fiorino SJD9D95</option>
                            <option value="Fiat Fiorino SJF5I91 ">Fiat Fiorino SJF5I91</option>
                            <option value="Chev Montana QPN-3I14 ">Chev Montana QPN-3I14</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Nome do Motorista / Técnico</label>
                        <input type="text" id="motorista" placeholder="Seu nome completo" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Quilometragem Atual (KM)</label>
                        <input type="number" id="quilometragem" placeholder="Ex: 45200" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Data da Inspeção</label>
                        <input type="date" id="dataVistoria" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
            </div>

            <!-- Checklist Dinâmico por Categorias -->
            <div id="containerChecklist" class="space-y-4">
                <!-- Preenchido via JavaScript -->
            </div>

            <!-- Seção de Foto Geral / Avarias -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-semibold text-blue-600 uppercase tracking-wider mb-3">
                    <i class="fa-solid fa-camera mr-1"></i> Registro Fotográfico de Avarias
                </h2>
                <div class="flex flex-col sm:flex-row gap-3 items-center">
                    <div class="w-full flex gap-2">
                        <!-- Opção Câmera Direta -->
                        <label class="flex-1 bg-slate-50 border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-lg p-3 text-center cursor-pointer transition">
                            <i class="fa-solid fa-camera text-blue-500 text-lg mb-1 block"></i>
                            <span class="text-xs font-medium text-slate-600">Tirar Foto</span>
                            <input type="file" accept="image/*" capture="environment" id="fotoCamera" class="hidden" onchange="processarFoto(event)">
                        </label>
                        <!-- Opção Galeria de Arquivos -->
                        <label class="flex-1 bg-slate-50 border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-lg p-3 text-center cursor-pointer transition">
                            <i class="fa-solid fa-image text-emerald-500 text-lg mb-1 block"></i>
                            <span class="text-xs font-medium text-slate-600">Galeria</span>
                            <input type="file" accept="image/*" id="fotoGaleria" class="hidden" onchange="processarFoto(event)">
                        </label>
                    </div>
                </div>
                <!-- Miniaturas das fotos -->
                <div id="galeriaFotos" class="grid grid-cols-3 sm:grid-cols-4 gap-2 mt-3"></div>
            </div>

            <!-- Botão de Salvar -->
            <button onclick="salvarVistoria()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition flex items-center justify-center gap-2 text-base">
                <i class="fa-solid fa-floppy-disk"></i> Salvar e Finalizar Vistoria
            </button>
        </section>

        <!-- TELA DE HISTÓRICO -->
        <section id="secaoHistorico" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider">
                        <i class="fa-solid fa-list mr-1"></i> Vistorias Realizadas
                    </h2>
                    <span id="contadorHistorico" class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-full font-medium">0 registros</span>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-slate-400 text-sm"></i>
                    <input type="text" id="filtroHistorico" placeholder="Buscar por placa ou motorista..." onkeyup="filtrarHistorico()" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div id="listaHistorico" class="space-y-3">
                <!-- Preenchido via JavaScript -->
            </div>
        </section>

    </main>

    <!-- MODAL DE VISUALIZAÇÃO DE DETALHES -->
    <div id="modalDetalhes" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-blue-600 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-sm flex items-center gap-2">
                    <i class="fa-solid fa-file-lines"></i> Relatório de Vistoria
                </h3>
                <button onclick="fecharModal()" class="text-white hover:text-slate-200 text-lg font-bold">&times;</button>
            </div>
            
            <div id="conteudoModalDetalhes" class="p-4 overflow-y-auto space-y-4 text-sm flex-1">
                <!-- Conteúdo gerado via JS -->
            </div>

            <div class="bg-slate-50 border-t border-slate-200 p-3 flex flex-wrap gap-2 justify-end">
                <button onclick="compartilharWhatsApp()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                    <i class="fa-brands fa-whatsapp text-sm"></i> Enviar WhatsApp
                </button>
                <button onclick="exportarPDFModal()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-file-pdf text-sm"></i> Baixar PDF Completo
                </button>
                <button onclick="fecharModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg text-xs font-medium transition">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DA APLICAÇÃO -->
    <script>
        // Estrutura do Checklist com Categorias e Itens Específicos de ISP + Novos Campos
        const categoriasChecklist = [
            {
                id: 'mecanica',
                titulo: 'Mecânica e Motor',
                icone: 'fa-gears',
                itens: [
                    'Nível de Óleo do Motor',
                    'Água do Radiador / Arrefecimento',
                    'Fluido de Freio',
                    'Correias e Mangueiras'
                ]
            },
            {
                id: 'seguranca',
                titulo: 'Pneus e Segurança',
                icone: 'fa-car-burst',
                itens: [
                    'Calibragem e Estado dos Pneus',
                    'Sistema de Freios (Pedal/Estacionamento)',
                    'Buzina e Sistema Elétrico',
                    'Faróis, Lanternas e Piscas'
                ]
            },
            {
                id: 'vidros',
                titulo: 'Vidros e Espelhos',
                icone: 'fa-car',
                itens: [
                    'Para-brisa (Sem trincas ou avarias)',
                    'Vidros Laterais e Traseiro',
                    'Retrovisores (Integridade e regulagem)'
                ]
            },
            {
                id: 'emergencia',
                titulo: 'Itens de Emergência',
                icone: 'fa-triangle-exclamation',
                itens: [
                    'Estepe calibrado e em boas condições',
                    'Macaco e Chave de Roda',
                    'Triângulo de Sinalização'
                ]
            },
            {
                id: 'telecom',
                titulo: 'Equipamentos de Telecom (ISP)',
                icone: 'fa-network-wired',
                itens: [
                    'Máquina de Fusão de Fibra',
                    'OTDR / Power Meter',
                    'Escada (Fixação e estado geral)',
                    'Kit EPIs (Capacete, óculos, bota, cinto)'
                ]
            }
        ];

        let fotosSalvas = [];
        let vistoriasSalvas = JSON.parse(localStorage.getItem('vistorias_frota')) || [];
        let vistoriaAtualDetalhe = null;

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('dataVistoria').valueAsDate = new Date();
            renderizarChecklist();
            carregarHistorico();
            registrarServiceWorker();
        });

        // Desenhar Checklist na Tela
        function renderizarChecklist() {
            const container = document.getElementById('containerChecklist');
            container.innerHTML = '';

            categoriasChecklist.forEach(cat => {
                let htmlItens = cat.itens.map((item, idx) => `
                    <div class="flex items-center justify-between py-2 border-b border-slate-100 last:border-b-0">
                        <span class="text-xs sm:text-sm text-slate-700">${item}</span>
                        <div class="flex gap-2">
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="radio" name="${cat.id}_${idx}" value="Ok" checked class="text-emerald-600 focus:ring-emerald-500">
                                <span class="ml-1 text-xs text-emerald-700 font-medium">Ok</span>
                            </label>
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="radio" name="${cat.id}_${idx}" value="Ruim/Avaria" class="text-red-600 focus:ring-red-500">
                                <span class="ml-1 text-xs text-red-700 font-medium">Avaria</span>
                            </label>
                        </div>
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <h2 class="text-sm font-semibold text-blue-600 uppercase tracking-wider mb-2 flex items-center gap-2">
                            <i class="fa-solid ${cat.icone}"></i> ${cat.titulo}
                        </h2>
                        <div class="space-y-1 mt-2">
                            ${htmlItens}
                        </div>
                        <div class="mt-3 pt-2 border-t border-slate-100">
                            <label class="block text-xs font-medium text-slate-500 mb-1">Observações / Detalhes desta seção:</label>
                            <input type="text" id="obs_${cat.id}" placeholder="Ex: Pneu dianteiro esquerdo com desgaste..." class="w-full border border-slate-200 bg-slate-50 rounded-lg p-2 text-xs outline-none focus:bg-white focus:ring-1 focus:ring-blue-500">
                        </div>
                    </div>
                `;
            });
        }

        // Processar e Compactar Imagens
        function processarFoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Redimensionar para otimizar espaço local
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    fotosSalvas.push(dataUrl);
                    atualizarGaleriaFotos();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function atualizarGaleriaFotos() {
            const galeria = document.getElementById('galeriaFotos');
            galeria.innerHTML = fotosSalvas.map((foto, index) => `
                <div class="relative group aspect-square bg-slate-200 rounded-lg overflow-hidden border border-slate-300">
                    <img src="${foto}" class="w-full h-full object-cover">
                    <button onclick="removerFoto(${index})" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow hover:bg-red-700">&times;</button>
                </div>
            `).join('');
        }

        function removerFoto(index) {
            fotosSalvas.splice(index, 1);
            atualizarGaleriaFotos();
        }

        // Salvar Vistoria
        function salvarVistoria() {
            const veiculo = document.getElementById('veiculo').value;
            const motorista = document.getElementById('motorista').value;
            const quilometragem = document.getElementById('quilometragem').value;
            const dataVistoria = document.getElementById('dataVistoria').value;

            if (!veiculo || !motorista || !quilometragem) {
                alert('Por favor, preencha o Veículo, o Motorista e a Quilometragem!');
                return;
            }

            // Coletar itens do checklist e observações
            let dadosChecklist = [];
            categoriasChecklist.forEach(cat => {
                let itensCat = [];
                cat.itens.forEach((item, idx) => {
                    const radios = document.getElementsByName(`${cat.id}_${idx}`);
                    let status = 'Ok';
                    for (let r of radios) {
                        if (r.checked) status = r.value;
                    }
                    itensCat.push({ nome: item, status: status });
                });
                let observacao = document.getElementById(`obs_${cat.id}`).value;
                dadosChecklist.push({ categoria: cat.titulo, itens: itensCat, obs: observacao });
            });

            const novaVistoria = {
                id: Date.now(),
                veiculo,
                motorista,
                quilometragem,
                data: dataVistoria,
                checklist: dadosChecklist,
                fotos: [...fotosSalvas]
            };

            vistoriasSalvas.unshift(novaVistoria);
            localStorage.setItem('vistorias_frota', JSON.stringify(vistoriasSalvas));

            alert('Vistoria salva com sucesso!');
            limparFormulario();
            alternarTela('historico');
        }

        function limparFormulario() {
            document.getElementById('veiculo').value = '';
            document.getElementById('motorista').value = '';
            document.getElementById('quilometragem').value = '';
            fotosSalvas = [];
            atualizarGaleriaFotos();
            renderizarChecklist();
        }

        // Histórico e Listagem
        function carregarHistorico() {
            const lista = document.getElementById('listaHistorico');
            const contador = document.getElementById('contadorHistorico');
            
            contador.innerText = `${vistoriasSalvas.length} registros`;

            if (vistoriasSalvas.length === 0) {
                lista.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-slate-400 text-xs">Nenhuma vistoria registrada ainda.</div>`;
                return;
            }

            lista.innerHTML = vistoriasSalvas.map(v => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-sm text-slate-800">${v.veiculo}</h4>
                        <p class="text-xs text-slate-500 mt-0.5">Motorista: <span class="font-medium text-slate-700">${v.motorista}</span></p>
                        <p class="text-xs text-slate-500">Data: ${v.data} | KM: ${v.quilometragem}</p>
                    </div>
                    <button onclick="abrirDetalhes(${v.id})" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1">
                        <i class="fa-solid fa-eye"></i> Ver
                    </button>
                </div>
            `).join('');
        }

        function filtrarHistorico() {
            const termo = document.getElementById('filtroHistorico').value.toLowerCase();
            const filtradas = vistoriasSalvas.filter(v => 
                v.veiculo.toLowerCase().includes(termo) || v.motorista.toLowerCase().includes(termo)
            );
            
            const lista = document.getElementById('listaHistorico');
            if (filtradas.length === 0) {
                lista.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-slate-400 text-xs">Nenhum resultado encontrado.</div>`;
                return;
            }

            lista.innerHTML = filtradas.map(v => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-sm text-slate-800">${v.veiculo}</h4>
                        <p class="text-xs text-slate-500 mt-0.5">Motorista: <span class="font-medium text-slate-700">${v.motorista}</span></p>
                        <p class="text-xs text-slate-500">Data: ${v.data} | KM: ${v.quilometragem}</p>
                    </div>
                    <button onclick="abrirDetalhes(${v.id})" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1">
                        <i class="fa-solid fa-eye"></i> Ver
                    </button>
                </div>
            `).join('');
        }

        // Modal de Detalhes
        function abrirDetalhes(id) {
            const v = vistoriasSalvas.find(item => item.id === id);
            if (!v) return;
            vistoriaAtualDetalhe = v;

            let htmlChecklist = v.checklist.map(cat => `
                <div class="border-b border-slate-100 pb-2 mb-2">
                    <strong class="text-blue-600 text-xs block uppercase">${cat.categoria}</strong>
                    ${cat.itens.map(i => `
                        <div class="flex justify-between text-xs py-0.5">
                            <span class="text-slate-700">${i.nome}</span>
                            <span class="font-semibold ${i.status === 'Ok' ? 'text-emerald-600' : 'text-red-600'}">${i.status}</span>
                        </div>
                    `).join('')}
                    ${cat.obs ? `<p class="text-xs text-slate-500 mt-1 italic bg-slate-50 p-1.5 rounded">Obs: ${cat.obs}</p>` : ''}
                </div>
            `).join('');

            let htmlFotos = v.fotos.length > 0 ? `
                <div class="mt-3">
                    <strong class="text-xs font-semibold text-slate-700 block mb-2">Fotos Registradas (${v.fotos.length})</strong>
                    <div class="grid grid-cols-4 gap-2">
                        ${v.fotos.map(f => `<img src="${f}" class="w-full h-20 object-cover rounded border border-slate-200">`).join('')}
                    </div>
                </div>
            ` : '';

            document.getElementById('conteudoModalDetalhes').innerHTML = `
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <p><strong>Veículo:</strong> ${v.veiculo}</p>
                    <p><strong>Motorista:</strong> ${v.motorista}</p>
                    <p><strong>KM:</strong> ${v.quilometragem} | <strong>Data:</strong> ${v.data}</p>
                </div>
                <div class="space-y-2 mt-3">
                    <h4 class="font-bold text-xs uppercase text-slate-600">Itens Verificados:</h4>
                    ${htmlChecklist}
                </div>
                ${htmlFotos}
            `;

            document.getElementById('modalDetalhes').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modalDetalhes').classList.add('hidden');
            vistoriaAtualDetalhe = null;
        }

        // Geração de PDF Completo com jsPDF
        function exportarPDFModal() {
            if (!vistoriaAtualDetalhe) return;
            const v = vistoriaAtualDetalhe;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            let y = 15;
            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.setTextColor(37, 99, 235);
            doc.text("Relatorio de Vistoria de Frota - ISP", 14, y);
            
            y += 10;
            doc.setFontSize(10);
            doc.setTextColor(100, 100, 100);
            doc.text(`Data: ${v.data} | Quilometragem: ${v.quilometragem} KM`, 14, y);
            
            y += 6;
            doc.text(`Veiculo: ${v.veiculo}`, 14, y);
            y += 6;
            doc.text(`Motorista / Tecnico: ${v.motorista}`, 14, y);

            y += 10;
            doc.setDrawColor(200, 200, 200);
            doc.line(14, y, 196, y);
            y += 8;

            v.checklist.forEach(cat => {
                if (y > 270) { doc.addPage(); y = 20; }
                doc.setFont("helvetica", "bold");
                doc.setFontSize(11);
                doc.setTextColor(37, 99, 235);
                doc.text(cat.categoria.toUpperCase(), 14, y);
                y += 6;

                doc.setFont("helvetica", "normal");
                doc.setFontSize(9);
                doc.setTextColor(50, 50, 50);

                cat.itens.forEach(item => {
                    if (y > 280) { doc.addPage(); y = 20; }
                    doc.text(`- ${item.nome}:`, 18, y);
                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(item.status === 'Ok' ? 16 : 220, item.status === 'Ok' ? 120 : 38, item.status === 'Ok' ? 66 : 38);
                    doc.text(item.status, 140, y);
                    doc.setFont("helvetica", "normal");
                    doc.setTextColor(50, 50, 50);
                    y += 5;
                });

                if (cat.obs) {
                    if (y > 275) { doc.addPage(); y = 20; }
                    doc.setFont("italic");
                    doc.setTextColor(100, 100, 100);
                    doc.text(`Obs: ${cat.obs}`, 18, y);
                    doc.setFont("normal");
                    y += 6;
                }
                y += 4;
            });

            // Adicionar fotos se houver
            if (v.fotos && v.fotos.length > 0) {
                doc.addPage();
                y = 20;
                doc.setFont("helvetica", "bold");
                doc.setFontSize(14);
                doc.setTextColor(37, 99, 235);
                doc.text("Registro Fotografico de Avarias", 14, y);
                y += 10;

                let xPos = 14;
                let imgWidth = 55;
                let imgHeight = 55;

                v.fotos.forEach((fotoBase64, index) => {
                    if (y > 220) { doc.addPage(); y = 20; xPos = 14; }
                    try {
                        doc.addImage(fotoBase64, 'JPEG', xPos, y, imgWidth, imgHeight);
                    } catch(e) {}

                    xPos += 62;
                    if ((index + 1) % 3 === 0) {
                        xPos = 14;
                        y += 62;
                    }
                });
            }

            doc.save(`Vistoria_${v.veiculo.replace(/[^a-zA-Z0-9]/g, '_')}_${v.data}.pdf`);
        }

        // Enviar por WhatsApp
        function compartilharWhatsApp() {
            if (!vistoriaAtualDetalhe) return;
            const v = vistoriaAtualDetalhe;

            let textoAvarias = "";
            v.checklist.forEach(cat => {
                let avariasCat = cat.itens.filter(i => i.status !== 'Ok');
                if (avariasCat.length > 0 || cat.obs) {
                    textoAvarias += `\n*${cat.categoria}*:`;
                    avariasCat.forEach(i => { textoAvarias += `\n  - ${i.nome}: ⚠️ ${i.status}`; });
                    if (cat.obs) textoAvarias += `\n  - Obs: ${cat.obs}`;
                }
            });

            if (!textoAvarias) textoAvarias = "\nNenhuma avaria reportada. Todos os itens OK!";

            const mensagem = `📋 *RELATÓRIO DE VISTORIA - FROTA*` +
                             `\n🚗 *Veículo:* ${v.veiculo}` +
                             `\n👤 *Motorista:* ${v.motorista}` +
                             `\n📅 *Data:* ${v.data} | *KM:* ${v.quilometragem}` +
                             `\n\n🔍 *Resumo de Inspeção:*` +
                             textoAvarias +
                             `\n\n_Relatório gerado pelo App Interno de Frota._`;

            const linkWp = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensagem)}`;
            window.open(linkWp, '_blank');
        }

        // Alternar Telas
        function alternarTela(tela) {
            const form = document.getElementById('secaoFormulario');
            const hist = document.getElementById('secaoHistorico');
            const btnH = document.getElementById('btnHistorico');
            const btnF = document.getElementById('btnForm');

            if (tela === 'historico') {
                form.classList.add('hidden');
                hist.classList.remove('hidden');
                btnH.classList.add('hidden');
                btnF.classList.remove('hidden');
                carregarHistorico();
            } else {
                form.classList.remove('hidden');
                hist.classList.add('hidden');
                btnH.classList.remove('hidden');
                btnF.classList.add('hidden');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Service Worker PWA básico
        function registrarServiceWorker() {
            if ('serviceWorker' in navigator) {
                const swCode = `self.addEventListener('fetch', function(event) { event.respondWith(fetch(event.request).catch(() => caches.match(event.request))); });`;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            }
        }
    </script>
</body>
